<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planos · Robotrend IA</title>
  <link rel="stylesheet" href="/output.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .pricing-free-wrap { margin-bottom: 28px; }
    .pricing-premium-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
    .pricing-card { border-radius: 20px; padding: 24px; border: 1px solid var(--line); background: var(--card-bg); position: relative; }
    .pricing-card.featured { border-color: var(--brand); box-shadow: var(--shadow-glow); transform: scale(1.02); }
    .pricing-card.best { border-color: #ffb547; }
    .pricing-badge { display: inline-block; font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
    .pricing-badge.hot { background: rgba(20,184,94,.16); color: var(--brand); }
    .pricing-badge.save { background: rgba(255,181,71,.16); color: #ffb547; }
    .pricing-price { font-size: 2.25rem; font-weight: 900; margin-top: 8px; line-height: 1.1; }
    .pricing-cycle { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .pricing-save { font-size: 12px; font-weight: 800; color: #ffb547; margin-top: 8px; }
    .pricing-features { margin-top: 16px; font-size: 13px; color: var(--text-2); }
    .pricing-features li { margin-bottom: 6px; }
  </style>
</head>
<body class="font-display antialiased min-h-screen px-4 py-8">
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>

  <div class="max-w-6xl mx-auto relative">
    <header class="flex items-center justify-between mb-10">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl grid place-items-center font-extrabold" style="background: linear-gradient(135deg,#00d97e,#14b85e); color:#03110b; box-shadow: 0 0 24px var(--brand-glow);">R</div>
        <div>
          <div class="font-extrabold tracking-tight">Robotrend <span style="color: var(--brand);">IA</span></div>
          <div class="text-[11px] uppercase tracking-widest" style="color: var(--muted);">Plataforma de Sinais</div>
        </div>
      </a>
      <div class="flex items-center gap-2">
        <a href="/" class="btn-ghost">← Painel</a>
        <a href="/login.html" class="btn-primary">Entrar</a>
      </div>
    </header>

    <div class="text-center mb-8">
      <div class="text-xs font-extrabold uppercase tracking-[0.35em]" style="color: var(--brand);">Planos & Preços</div>
      <h1 class="text-4xl lg:text-5xl font-extrabold tracking-tight mt-2">Escolha seu plano Premium</h1>
      <p class="mt-2 text-sm" style="color: var(--muted);">Planos a partir de R$ 79,90 · mesmo acesso completo em todos os ciclos</p>
      <div id="upgrade-notice" class="hidden mt-4 inline-block px-4 py-2 rounded-lg text-sm" style="background: rgba(255, 181, 71, .12); color: var(--warn); border: 1px solid rgba(255, 181, 71, .3);">
        ⚠️ Esta funcionalidade é exclusiva para assinantes Premium. Escolha um plano abaixo.
      </div>
    </div>

    <div class="pricing-free-wrap">
      <div id="free-plan-card"></div>
    </div>

    <div id="plans-grid" class="pricing-premium-grid">
      <div class="card-skeleton"></div><div class="card-skeleton"></div><div class="card-skeleton"></div>
    </div>

    <!-- Modal de pagamento (após escolher plano + login) -->
    <div id="payment-modal" class="hidden fixed inset-0 z-50 grid place-items-center px-4" style="background: rgba(3,8,5,0.85); backdrop-filter: blur(6px);">
      <div class="w-full max-w-md rounded-2xl p-6 border" style="background: var(--card-bg); border-color: var(--card-border);">
        <div class="flex items-center justify-between mb-4">
          <div>
            <h2 class="text-lg font-extrabold">Finalizar assinatura</h2>
            <p id="checkout-plan-label" class="text-xs" style="color:var(--muted);">—</p>
          </div>
          <button type="button" onclick="document.getElementById('payment-modal').classList.add('hidden')" class="btn-icon">✕</button>
        </div>
        <div class="mb-3">
          <label class="text-xs" style="color: var(--muted);">Cupom de desconto (opcional)</label>
          <div class="flex gap-2 mt-1">
            <input id="coupon-input" type="text" class="input-field flex-1" placeholder="Ex: ROBOT10" style="text-transform: uppercase;" />
            <button id="coupon-apply" class="btn-ghost">Aplicar</button>
          </div>
          <div id="coupon-status" class="text-xs mt-1"></div>
        </div>
        <div class="mb-3">
          <button id="btn-virar-premium" class="btn-primary w-full justify-center py-3" style="font-weight:800;font-size:15px">
            🚀 Pagar com Mercado Pago — <span id="btn-mp-label">—</span>
          </button>
          <div id="btn-mp-note" class="text-xs mt-2 text-center" style="color: var(--muted);">—</div>
        </div>
        <div class="grid grid-cols-2 gap-2 mb-4 text-xs">
          <button class="btn-ghost provider-btn" data-provider="stripe">💳 Stripe</button>
          <button class="btn-ghost provider-btn" data-provider="pix">⚡ PIX direto</button>
        </div>
        <button type="button" id="btn-change-plan" class="btn-ghost w-full text-xs mb-2">← Escolher outro plano</button>
        <div id="checkout-result" class="text-sm" style="color: var(--text-2);"></div>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/user-state.js"></script>
  <script src="/js/upgrade-celebration.js"></script>
  <script src="/js/plan-picker.js"></script>
  <script src="/js/payments.js"></script>
  <script src="/js/support-chat.js"></script>
  <script>
    let currentPlan = null;
    let appliedCoupon = null;
    let premiumCycles = [];
    let freePlan = null;

    const CYCLE_SUFFIX = { PREMIUM: '/mês', SEMESTRAL: ' /6 meses', ANUAL: '/ano' };
    const CYCLE_NOTE = {
      PREMIUM: 'Renovação mensal · Premium liberado em segundos · Cancele quando quiser',
      SEMESTRAL: 'Pagamento único · 180 dias de Premium · liberado em segundos',
      ANUAL: 'Pagamento único · 365 dias de Premium · liberado em segundos',
    };

    const PREMIUM_FEATURES = [
      '✅ Análise ao vivo',
      '✅ Over 2.5 automático',
      '✅ Alertas no Telegram',
      '📊 Sinais ilimitados',
      '📅 Histórico 365 dias',
      '✅ Acesso à API REST',
    ];

    function fmtBRL(n) {
      return Number(n).toFixed(2).replace('.', ',');
    }

    async function loadPlansData() {
      const [plansRes, cycles] = await Promise.all([
        fetch('/api/plans').then((r) => r.json()).catch(() => ({ plans: [] })),
        window.RobotrendPlanPicker?.fetchCycles?.() || fetch('/api/plans/cycles').then((r) => r.json()).then((d) => d.cycles || []).catch(() => []),
      ]);
      freePlan = (plansRes.plans || []).find((p) => p.id === 'FREE') || null;
      premiumCycles = cycles || [];
    }

    function renderFreeCard() {
      const host = document.getElementById('free-plan-card');
      if (!freePlan || !host) return;
      host.innerHTML = `
        <div class="pricing-card" style="max-width:420px;">
          <div class="text-xs uppercase tracking-widest" style="color: var(--muted);">${freePlan.label}</div>
          <div class="pricing-price">Grátis</div>
          <div class="pricing-cycle">3 sinais por dia · sem cartão</div>
          <button type="button" data-plan="FREE" class="btn-ghost w-full justify-center mt-5 py-3 plan-btn">Começar grátis</button>
        </div>`;
      host.querySelector('.plan-btn')?.addEventListener('click', () => onPickPlan('FREE'));
    }

    function renderPremiumCards() {
      const grid = document.getElementById('plans-grid');
      const monthly = premiumCycles.find((c) => c.id === 'PREMIUM');
      if (!premiumCycles.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-12" style="color: var(--danger);">Não foi possível carregar os planos.</div>`;
        return;
      }
      grid.innerHTML = premiumCycles.map((c) => {
        const meta = window.RobotrendPlanPicker?.cycleMeta?.(c) || { short: c.label, sub: '' };
        const pct = window.RobotrendPlanPicker?.savingsPct?.(c, monthly) || 0;
        const featured = c.id === 'PREMIUM';
        const best = c.id === 'ANUAL';
        let badge = '';
        if (featured) badge = '<span class="pricing-badge hot">Mais popular</span>';
        else if (best) badge = '<span class="pricing-badge save">Melhor economia</span>';
        else if (pct > 0) badge = `<span class="pricing-badge save">Economize ${pct}%</span>`;
        return `
          <div class="pricing-card plan-card ${featured ? 'featured' : ''} ${best ? 'best' : ''}">
            ${badge}
            <div class="text-xs uppercase tracking-widest" style="color: var(--muted);">Premium ${meta.short}</div>
            <div class="pricing-price">R$ ${fmtBRL(c.priceBRL)}</div>
            <div class="pricing-cycle">${meta.sub}${c.id === 'PREMIUM' ? ' · cobrança recorrente' : ''}</div>
            ${pct > 0 ? `<div class="pricing-save">Equivale a R$ ${fmtBRL(window.RobotrendPlanPicker.monthlyEquivalent(c))}/mês</div>` : ''}
            <ul class="pricing-features">${PREMIUM_FEATURES.map((f) => `<li>${f}</li>`).join('')}</ul>
            <button type="button" data-plan="${c.id}" class="btn-${featured || best ? 'primary' : 'ghost'} w-full justify-center mt-5 py-3 plan-btn">
              Assinar Premium ${meta.short} →
            </button>
          </div>`;
      }).join('');
      grid.querySelectorAll('.plan-btn').forEach((btn) => {
        btn.addEventListener('click', () => onPickPlan(btn.dataset.plan));
      });
    }

    function updateCheckoutUI() {
      const c = premiumCycles.find((x) => x.id === currentPlan);
      const meta = c ? window.RobotrendPlanPicker?.cycleMeta?.(c) : null;
      const price = c?.priceBRL || 0;
      document.getElementById('checkout-plan-label').textContent = c
        ? `Premium ${meta?.short || c.id} · R$ ${fmtBRL(price)}`
        : '—';
      document.getElementById('btn-mp-label').textContent = c
        ? `R$ ${fmtBRL(price)}${CYCLE_SUFFIX[c.id] || ''}`
        : '—';
      document.getElementById('btn-mp-note').textContent = CYCLE_NOTE[currentPlan] || '';
    }

    function openCheckout(planId) {
      currentPlan = String(planId || 'PREMIUM').toUpperCase();
      appliedCoupon = null;
      document.getElementById('coupon-status').textContent = '';
      document.getElementById('checkout-result').innerHTML = '';
      updateCheckoutUI();
      document.getElementById('payment-modal').classList.remove('hidden');
    }

    window.RobotrendPricing = { openCheckout };

    async function onPickPlan(plan) {
      if (plan === 'FREE') {
        if (!RobotrendAuth.getToken()) location.href = '/register.html';
        else location.href = '/';
        return;
      }
      if (!RobotrendAuth.getToken()) {
        location.href = `/login.html?next=${encodeURIComponent('/pricing.html?checkout=' + plan)}`;
        return;
      }
      openCheckout(plan);
    }

    document.getElementById('coupon-apply').addEventListener('click', async () => {
      const code = (document.getElementById('coupon-input')?.value || '').trim().toUpperCase();
      const status = document.getElementById('coupon-status');
      if (!code || !currentPlan) return;
      const c = premiumCycles.find((x) => x.id === currentPlan);
      const basePrice = c?.priceBRL || 0;
      try {
        const r = await fetch('/api/beta/coupons/apply', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, plan: currentPlan, basePrice }),
        });
        const data = await r.json();
        if (!data.ok) {
          status.textContent = '❌ ' + data.error;
          status.style.color = 'var(--danger)';
          appliedCoupon = null;
        } else {
          status.innerHTML = `✅ Cupom aplicado! Desconto: R$ ${data.discount.toFixed(2)} · Total: <b>R$ ${data.finalPrice.toFixed(2)}</b>`;
          status.style.color = 'var(--brand)';
          appliedCoupon = data.coupon.code;
        }
      } catch (e) {
        status.textContent = 'Erro: ' + e.message;
      }
    });

    document.getElementById('btn-virar-premium').addEventListener('click', () => {
      const btn = document.getElementById('btn-virar-premium');
      window.virarPremium({
        plan: currentPlan || 'PREMIUM',
        coupon: appliedCoupon,
        button: btn,
        skipPicker: true,
      });
    });

    document.getElementById('btn-change-plan').addEventListener('click', async () => {
      document.getElementById('payment-modal').classList.add('hidden');
      const picked = await window.RobotrendPlanPicker.open({ preselected: currentPlan });
      if (picked) openCheckout(picked);
    });

    document.querySelectorAll('.provider-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const provider = btn.dataset.provider;
        const result = document.getElementById('checkout-result');
        result.innerHTML = '⏳ gerando link...';
        try {
          const r = await RobotrendAuth.api('/api/payments/checkout', {
            method: 'POST',
            body: JSON.stringify({ plan: currentPlan, provider, coupon: appliedCoupon }),
          });
          if (provider === 'pix' && r.qrUrl) {
            result.innerHTML = `
              <div class="text-center">
                <div class="text-sm" style="color: var(--muted);">PIX · R$ ${r.amount}</div>
                <img src="${r.qrUrl}" alt="QR Code PIX" class="mx-auto my-3 rounded-lg border" style="border-color: var(--line);" />
                <textarea readonly class="w-full text-xs font-mono p-2 rounded border" style="background: var(--surface-2); border-color: var(--line); color: var(--text);">${r.code}</textarea>
              </div>`;
          } else if (r.url) {
            result.innerHTML = `<a href="${r.url}" class="btn-primary w-full justify-center">${r.mock ? '🧪 Ativar (mock)' : 'Ir para checkout →'}</a>`;
            if (!r.mock) location.href = r.url;
          } else {
            result.textContent = r.message || JSON.stringify(r);
          }
        } catch (ex) {
          result.innerHTML = `<div style="color: var(--danger);">${ex.message}</div>`;
        }
      });
    });

    (async function init() {
      const u = new URLSearchParams(location.search).get('upgrade');
      if (u) document.getElementById('upgrade-notice')?.classList.remove('hidden');
      try {
        await loadPlansData();
        renderFreeCard();
        renderPremiumCards();
        const checkout = new URLSearchParams(location.search).get('checkout');
        if (checkout && ['PREMIUM', 'SEMESTRAL', 'ANUAL'].includes(checkout.toUpperCase())) {
          if (RobotrendAuth.getToken()) openCheckout(checkout.toUpperCase());
        }
      } catch (e) {
        document.getElementById('plans-grid').innerHTML = `<div class="text-center py-12" style="color:var(--danger);">${e.message}</div>`;
      }
    })();
  </script>
</body>
</html>

# Robotrend IA v5 — Render.com blueprint
#
# JWT_SECRET e SESSION_SECRET: sync false — cole valores de `npm run secrets:render`
# (hex 128 chars). NÃO use placeholders curtos no painel Environment.
# WEBHOOK_SECRET / METRICS_TOKEN / BOOTSTRAP_ADMIN_PASSWORD: generateValue (~44 chars base64).
#
# O Render injeta automaticamente RENDER_EXTERNAL_URL no Web Service.
# O backend usa essa URL para CORS/APP_URL se ALLOWED_ORIGINS não estiver definido.
#
# Obrigatório preencher manualmente (sync: false):
#   - BOOTSTRAP_ADMIN_EMAIL
#
# Opcional (recomendado; senão usa RENDER_EXTERNAL_URL):
#   - ALLOWED_ORIGINS, APP_URL, PUBLIC_URL
# E opcionalmente: API_FOOTBALL_KEY, MP_*, STRIPE_*, TELEGRAM_*.

services:
  - type: web
    name: robotrend-ia
    env: node
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: npm install && npm run tailwind:build
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3010
      - key: PGSSL
        value: "true"
      - key: ANTI_FAKE_PRESSURE
        value: "true"
      - key: ML_AUTOTUNE
        value: "true"
      - key: SIGNAL_MIN_SCORE
        value: "80"
      - key: LIVE_SCAN_INTERVAL_MS
        value: "15000"
      # ----------------------------------------------------------
      # API-FOOTBALL — economia de quota (plano Free = 100 req/dia)
      # ----------------------------------------------------------
      # Intervalo do poller central (ms). 300000 = 5 min => 288 req/dia.
      - key: FOOTBALL_POLL_INTERVAL_MS
        value: "300000"
      # TTL do cache fresh do endpoint /fixtures?live=all.
      # 300000ms = 5 min: alinhado com o intervalo do poller.
      - key: AF_TTL_LIVE
        value: "300000"
      # Bot consensus desligado: NÃO repete getLiveFixtures a cada 15s.
      # Modos válidos: strict | relaxed | off. Aqui ficamos em off.
      - key: MATCH_CONSENSUS_MODE
        value: "off"
      # FixtureEnricher automático desligado para não gastar 2 req por
      # fixture (stats+events). Quando alguém abre uma fixture na UI o
      # enricher é chamado sob demanda separadamente — esse flag corta
      # apenas o pipeline automático (queueFromPoller / autoEnrich).
      - key: ENRICH_ENABLED
        value: "false"
      # Apenas UM processo deve rodar o poller. Como NÃO existe service
      # `type: worker` neste blueprint, o web é o único poller.
      - key: FOOTBALL_POLLER_ENABLED
        value: "true"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "120"
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: TZ
        value: America/Sao_Paulo
      # Assinatura JWT / sessão — obrigatório colar no primeiro deploy (mín. 32, ideal 128 hex)
      - key: JWT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_FORCE_RESET
        value: "false"
      # P0: NUNCA conceder PREMIUM/VIP automaticamente em produção.
      # Se algum dia quiser trial em prod, mude aqui — mas o default é off.
      - key: TRIAL_ON_SIGNUP
        value: "false"
      # CORS / URLs — opcionais: startup-check usa RENDER_EXTERNAL_URL como fallback
      - key: ALLOWED_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      # Render define automaticamente (não declarar aqui):
      # RENDER_EXTERNAL_URL, RENDER_SERVICE_URL
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ENABLED
        value: "false"
      # API-Football (API-Sports) — ÚNICA FONTE de partidas do sistema.
      # Cole API_FOOTBALL_KEY no painel Environment (Render → Service → Environment).
      # Header x-apisports-key é enviado automaticamente pelo backend.
      # NÃO defina PGHOST=postgres — causa getaddrinfo ENOTFOUND no Render.
      # DATABASE_URL vem do bloco fromDatabase abaixo.
      - key: API_FOOTBALL_KEY
        sync: false
      - key: API_FOOTBALL_HOST
        value: v3.football.api-sports.io
      - key: ODDS_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: robotrend-pg
          property: connectionString

databases:
  - name: robotrend-pg
    plan: starter
    databaseName: robotrend
    user: robotrend
    region: oregon
